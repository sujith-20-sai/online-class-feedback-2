<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Class Feedback Form</title>

    <!-- 1. EXTERNAL CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- 2. INTERNAL CSS -->
    <style>
        /* ID Selector: Form container box */
        #feedbackForm {
            background-color: rgb(255, 255, 255);
            max-width: 480px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        /* Element Selector: Heading */
        h2 {
            text-align: center;
            color: rgb(30, 41, 59);
            margin-bottom: 8px;
        }

        /* Class Selector: Button container */
        .btn-box {
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Main Form with ID Selector -->
    <form id="feedbackForm" action="#" method="POST">
        
        <h2>Online Class Feedback</h2>
        
        <!-- 3. INLINE CSS EXAMPLE 1: Subtitle styling -->
        <p style="text-align: center; color: rgb(100, 100, 100); font-size: 13px; margin-bottom: 20px;">
            Please share your feedback to help us improve the class.
        </p>

        <!-- Student Name -->
        <div class="form-group">
            <label for="name">
                Full Name:
                <!-- 3. INLINE CSS EXAMPLE 2: Red asterisk for required field -->
                <span style="color: rgb(220, 38, 38); font-weight: bold;">*</span>
            </label>
            <input type="text" id="name" name="name" placeholder="Enter your full name" required>
        </div>

        <!-- Student Email -->
        <div class="form-group">
            <label for="email">
                Email Address:
                <span style="color: rgb(220, 38, 38); font-weight: bold;">*</span>
            </label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>

        <!-- Course Selection -->
        <div class="form-group">
            <label for="course">
                Select Course:
                <span style="color: rgb(220, 38, 38); font-weight: bold;">*</span>
            </label>
            <select id="course" name="course" required>
                <option value="">-- Choose your course --</option>
                <option value="web-dev">Web Development (HTML, CSS, JS)</option>
                <option value="python">Python Programming</option>
                <option value="java">Java Full Stack</option>
            </select>
        </div>

        <!-- Class Rating -->
        <div class="form-group">
            <label>
                Rate Today's Class:
                <span style="color: rgb(220, 38, 38); font-weight: bold;">*</span>
            </label>
            <div class="radio-group">
                <label><input type="radio" name="rating" value="Poor" required> Poor</label>
                <label><input type="radio" name="rating" value="Average"> Average</label>
                <label><input type="radio" name="rating" value="Good"> Good</label>
                <label><input type="radio" name="rating" value="Excellent"> Excellent</label>
            </div>
        </div>

        <!-- Comments / Suggestions -->
        <div class="form-group">
            <label for="comments">Suggestions / Feedback:</label>
            <textarea id="comments" name="comments" placeholder="Write your comments here..."></textarea>
        </div>

        <!-- Submit & Reset Buttons -->
        <div class="btn-box">
            <!-- 3. INLINE CSS EXAMPLE 3: Button color styling -->
            <button type="submit" class="btn" style="background-color: rgb(37, 99, 235); color: rgb(255, 255, 255);">
                Submit Feedback
            </button>
            <button type="reset" class="btn btn-reset">
                Reset
            </button>
        </div>

    </form>

</body>
</html>
